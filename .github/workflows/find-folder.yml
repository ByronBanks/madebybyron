# One-off, READ-ONLY check: logs in over FTP and lists folder names so we can find
# the exact path to MadeByByron/Website. It never uploads, renames or deletes anything.
# Run it from the Actions tab (or `gh workflow run find-folder.yml`); delete it once deploys work.

name: Find site folder (read-only)

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null

      - name: Try secure FTP (FTPS) with certificate check
        id: ftps
        continue-on-error: true
        run: |
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" -e "
            set net:max-retries 1; set net:timeout 20; set ftp:ssl-force true;
            echo '== Login folder:'; pwd;
            echo '== Top-level folders:'; cls -1 --dirs;
            echo '== Paths containing MadeByByron (3 levels deep):'; find -d 4 . | grep -i madebybyron;
            bye"

      - name: If that failed, try FTPS without certificate check, then plain FTP (listing only)
        if: steps.ftps.outcome == 'failure'
        run: |
          echo "== FTPS without certificate check:"
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" -e "
            set net:max-retries 1; set net:timeout 20; set ftp:ssl-force true; set ssl:verify-certificate no;
            pwd; cls -1 --dirs; bye" && exit 0
          echo "== Plain FTP:"
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" -e "
            set net:max-retries 1; set net:timeout 20; set ftp:ssl-allow false;
            pwd; cls -1 --dirs; bye"
