# Uploads the site to bmbc-digital.co.uk/MadeByByron/Website/ whenever main changes
# (a push, an edit on github.com, or Publish in the site editor).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.bmbc-digital.co.uk
#   FTP_USERNAME  a cPanel FTP account whose directory is ONLY the MadeByByron/Website folder
#   FTP_PASSWORD
# Optional repository variables:
#   FTP_SERVER_DIR  folder to upload into, relative to the FTP account's home (default ./)
#   FTP_PROTOCOL    ftps (default) or ftp

name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md
            **/.DS_Store
