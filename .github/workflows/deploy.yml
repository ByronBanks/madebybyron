# Uploads the site to bmbc-digital.co.uk/MadeByByron/Website/ whenever main changes
# (a push, an edit on github.com, or Publish in the site editor).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.bmbc-digital.co.uk
#   FTP_USERNAME
#   FTP_PASSWORD
# Repository variables:
#   FTP_SERVER_DIR  folder to upload into, from the FTP login's home; must end in MadeByByron/Website/
#   FTP_PROTOCOL    ftps (default) or ftp
#
# The FTP login can see the whole hosting account (including other sites), so the
# deploy refuses to run unless FTP_SERVER_DIR points at this site's own folder.
# The upload tool only removes files it uploaded itself; it never touches anything else.

name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure we only upload into this site's folder
        env:
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          case "$DIR" in
            *MadeByByron/Website/) echo "Uploading into: $DIR" ;;
            *) echo "::error::FTP_SERVER_DIR must be set and end in MadeByByron/Website/ (got '$DIR'). Stopping so nothing else on the server is touched."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md
            **/.DS_Store
