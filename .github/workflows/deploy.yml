# Uploads the site to bmbc-digital.co.uk/MadeByByron/Website/ whenever main changes
# (a push, an edit on github.com, or Publish in the site editor).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.bmbc-digital.co.uk
#   FTP_USERNAME
#   FTP_PASSWORD
#   CMS_GITHUB_TOKEN  fine-grained token (this repo, Contents: read & write) used by the editor server
#   ADMIN_EMAIL       where password reset links are sent (optional)
# Repository variables:
#   FTP_SERVER_DIR  folder to upload into, from the FTP login's home; must end in MadeByByron/Website/
#   FTP_PROTOCOL    ftps (default) or ftp
#
# The FTP login can see the whole hosting account (including other sites), so the
# deploy refuses to run unless FTP_SERVER_DIR points at this site's own folder.
# The upload tool only removes files it uploaded itself; it never touches anything else.

name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure we only upload into this site's folder
        env:
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          case "$DIR" in
            *MadeByByron/Website/) echo "Uploading into: $DIR" ;;
            *) echo "::error::FTP_SERVER_DIR must be set and end in MadeByByron/Website/ (got '$DIR'). Stopping so nothing else on the server is touched."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # The editor server (api/cms.php) reads its settings from api/config.php, written here
      # from secrets so the GitHub token never appears in the repository.
      - name: Write editor server config
        env:
          CMS_GITHUB_TOKEN: ${{ secrets.CMS_GITHUB_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SITE_URL: https://bmbc-digital.co.uk/MadeByByron/Website/
        run: |
          php -r '
            $c = [
              "github_token" => getenv("CMS_GITHUB_TOKEN") ?: "",
              "admin_email"  => getenv("ADMIN_EMAIL") ?: "",
              "repo"         => getenv("REPO"),
              "branch"       => getenv("BRANCH"),
              "site_url"     => getenv("SITE_URL"),
            ];
            file_put_contents("api/config.php", "<?php\n// Written by the deploy from GitHub secrets. Do not edit or commit.\nreturn " . var_export($c, true) . ";\n");
          '
          php -l api/config.php
          echo "Editor server configured: token $( [ -n "$CMS_GITHUB_TOKEN" ] && echo yes || echo no ), reset email $( [ -n "$ADMIN_EMAIL" ] && echo yes || echo no )"

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md
            **/.DS_Store
            api/data/**
