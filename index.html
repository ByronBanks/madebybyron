<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>made by byron</title>
  <meta name="description" content="Design, photography, film and code — made by byron.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cms.css">
  <script>
    // Apply saved theme before paint to avoid a flash
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <a href="#top" class="logo">made by <em>byron</em></a>
    <nav class="nav-links">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <button class="sign-in" id="signInBtn">Sign in</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="sun">☀</span><span class="moon">☾</span>
      </button>
    </nav>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1>
        <span id="heroHeadline"></span><br>
        <span class="serif">made by</span> <span class="rotator" id="rotator"></span>.
      </h1>
      <div class="hero-foot">
        <p id="heroIntro"></p>
        <a href="#work" class="btn" id="heroCta"></a>
      </div>
    </section>

    <!-- Marquee -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>

    <!-- Work -->
    <section class="section" id="work">
      <div class="section-head">
        <h2 id="workHeading"></h2>
        <div class="filters" id="filters" role="tablist">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="design">Design</button>
          <button class="chip" data-filter="photo">Photo &amp; Film</button>
          <button class="chip" data-filter="dev">Development</button>
          <button class="chip" data-filter="studio">Studio</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- Services -->
    <section class="section" id="services">
      <h2 id="servicesHeading"></h2>
      <div class="services" id="servicesList"></div>
    </section>

    <!-- About -->
    <section class="section about" id="about">
      <div class="about-portrait" id="aboutPortrait">
        <span>Your photo here</span>
      </div>
      <div>
        <h2 id="aboutHeading"></h2>
        <p class="lead" id="aboutLead"></p>
        <p id="aboutBio"></p>
        <ul class="clients" id="clients"></ul>
      </div>
    </section>

    <!-- Contact -->
    <section class="contact" id="contact">
      <p class="eyebrow" id="contactEyebrow"></p>
      <a href="#" class="big-link" id="contactLink"></a>
      <div class="socials" id="socials"></div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> made by byron</span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <!-- Project modal -->
  <dialog class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-art" id="modalArt"></div>
    <div class="modal-body">
      <p class="eyebrow" id="modalMeta"></p>
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
    </div>
  </dialog>

  <script src="cms-config.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
  <script src="cms.js"></script>
</body>
</html>
