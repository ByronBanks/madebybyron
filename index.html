<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>made by byron</title>
  <meta name="description" content="Design, photography, film and code — made by byron.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cms.css">
  <script>
    // Apply saved theme before paint to avoid a flash
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <a href="#top" class="logo">made by <em>byron</em></a>
    <nav class="nav-links">
      <span class="nav-menu" id="navMenu"></span>
      <button class="sign-in" id="signInBtn">Sign in</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="sun">☀</span><span class="moon">☾</span>
      </button>
    </nav>
  </header>

  <!-- Sections are drawn from content.json by script.js -->
  <main id="top"></main>

  <footer class="footer">
    <span>© <span id="year"></span> made by byron</span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <!-- Project modal -->
  <dialog class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-art" id="modalArt"></div>
    <div class="modal-body">
      <p class="eyebrow" id="modalMeta"></p>
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
    </div>
  </dialog>

  <script src="cms-config.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
  <script src="inspector.js"></script>
  <script src="cms.js"></script>
</body>
</html>
